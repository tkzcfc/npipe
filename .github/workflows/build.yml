name: build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:

# env:
#   CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # 构建 npipe-admin 管理面板（只构建一次，供所有平台共用）
  # ─────────────────────────────────────────────
  build-admin:
    name: Build Admin Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        working-directory: npipe-admin
        run: npm install

      - name: Build admin panel
        working-directory: npipe-admin
        run: npm run build
        # vite.config.ts 中 outDir 为 '../dist'，即仓库根目录下的 dist/

      - name: Upload admin dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/
          retention-days: 1

  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - name: Set Version
        id: set
        shell: bash
        run: |
          echo "version=v${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  build:
    needs: [build-admin, set-version]
    uses: ./.github/workflows/build-common.yml
    with:
      version: ${{ needs.set-version.outputs.version }}
      target_filter: ''

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
