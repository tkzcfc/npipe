name: build-manual

on:
  workflow_dispatch:
    inputs:
      target:
        description: '编译目标（留空则编译全部）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - aarch64-linux-android
          - x86_64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-musleabihf
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - arm-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabihf
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc
          - x86_64-win7-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin

jobs:
  build-admin:
    name: Build Admin Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        working-directory: npipe-admin
        run: npm install

      - name: Build admin panel
        working-directory: npipe-admin
        run: npm run build

      - name: Upload admin dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist/
          retention-days: 1

  set-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set Version
        id: set
        shell: bash
        run: |
          echo "version=manual-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: [build-admin, set-version]
    uses: ./.github/workflows/build-common.yml
    with:
      version: ${{ needs.set-version.outputs.version }}
      target_filter: ${{ github.event.inputs.target }}
