<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>npipe Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #0B0F14; }
      html[data-theme="light"], html[data-theme="light"] body { background: #F3F5F7; }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('npipe-theme') || localStorage.getItem('theme')
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system'
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          root.setAttribute('data-theme-mode', mode)
          root.classList.toggle('dark', dark)
          var lang = localStorage.getItem('npipe-lang') || localStorage.getItem('lang')
          if (lang === 'en-US' || lang === 'zh-CN') root.setAttribute('lang', lang === 'en-US' ? 'en' : 'zh-CN')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
